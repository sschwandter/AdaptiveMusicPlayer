name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Debug
      DERIVED_DATA_PATH: .build/DerivedData
      TEST_RESULT_BUNDLE: TestResults.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -scheme "$APP_NAME" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme "$APP_NAME" \
            -destination 'platform=macOS' \
            -only-testing:AdaptiveMusicPlayerTests \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$TEST_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-xcresult-${{ github.sha }}
          path: ${{ env.TEST_RESULT_BUNDLE }}
          if-no-files-found: error

      - name: Summarize test results
        if: always()
        run: python3 tools/ci/summarize_xcresult.py "$TEST_RESULT_BUNDLE" >> "$GITHUB_STEP_SUMMARY"

      - name: Package app artifact
        if: success()
        run: bash tools/ci/package_app.sh "$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION/$APP_NAME.app" "$APP_NAME.zip"

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-${{ github.sha }}
          path: ${{ env.APP_NAME }}.zip
