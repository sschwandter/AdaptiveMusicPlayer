name: macOS CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      DERIVED_DATA_PATH: .build/DerivedData
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Debug
      TEST_RESULT_BUNDLE: TestResults.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -scheme AdaptiveMusicPlayer \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme AdaptiveMusicPlayer \
            -destination 'platform=macOS' \
            -only-testing:AdaptiveMusicPlayerTests \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$TEST_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-xcresult-${{ github.sha }}
          path: ${{ env.TEST_RESULT_BUNDLE }}
          if-no-files-found: error

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import subprocess
          import sys

          bundle_path = "TestResults.xcresult"

          try:
              raw = subprocess.check_output([
                  "xcrun", "xcresulttool", "get",
                  "--legacy",
                  "--path", bundle_path,
                  "--format", "json",
              ], text=True)
          except subprocess.CalledProcessError as exc:
              print("## Test Results")
              print("")
              print(f"Could not read `{bundle_path}`: exit code {exc.returncode}")
              sys.exit(0)

          data = json.loads(raw)
          metrics = data.get("metrics", {})
          total = metrics.get("testsCount", {}).get("_value", "0")
          failed = metrics.get("testsFailedCount", {}).get("_value", "0")

          print("## Test Results")
          print("")
          print(f"- Total tests: {total}")
          print(f"- Failed tests: {failed}")
          print("")

          actions = data.get("actions", {}).get("_values", [])
          failure_summaries = []
          for action in actions:
              issues = action.get("actionResult", {}).get("issues", {})
              failure_summaries.extend(
                  issues.get("testFailureSummaries", {}).get("_values", [])
              )

          if not failure_summaries:
              print("All tests passed.")
              sys.exit(0)

          print("### Failures")
          print("")
          for failure in failure_summaries:
              test_name = failure.get("testCaseName", {}).get("_value", "Unknown test")
              message = failure.get("message", {}).get("_value", "No message")
              print(f"- `{test_name}`")
              print(f"  {message}")
          PY

      - name: Package app artifact
        if: success()
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION/$APP_NAME.app"
          ditto -c -k --keepParent "$APP_PATH" "$APP_NAME.zip"

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-${{ github.sha }}
          path: ${{ env.APP_NAME }}.zip

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: macos-26
    env:
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Release
      ARCHIVE_PATH: .build/ReleaseArchive/AdaptiveMusicPlayer.xcarchive
      EXPORT_PATH: .build/ReleaseExport

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Archive signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: |
          xcodebuild \
            -scheme AdaptiveMusicPlayer \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive

      - name: Export signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingCertificate</key>
            <string>$CODE_SIGN_IDENTITY</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH"

      - name: Package signed app
        run: |
          ditto -c -k --keepParent "$EXPORT_PATH/$APP_NAME.app" "$APP_NAME-signed.zip"

      - name: Upload signed app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-macOS-${{ github.sha }}
          path: ${{ env.APP_NAME }}-signed.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}-signed.zip
          generate_release_notes: true
