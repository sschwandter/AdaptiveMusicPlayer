name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      DERIVED_DATA_PATH: .build/DerivedData
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Debug
      TEST_RESULT_BUNDLE: TestResults.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -scheme AdaptiveMusicPlayer \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme AdaptiveMusicPlayer \
            -destination 'platform=macOS' \
            -only-testing:AdaptiveMusicPlayerTests \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$TEST_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-xcresult-${{ github.sha }}
          path: ${{ env.TEST_RESULT_BUNDLE }}
          if-no-files-found: error

      - name: Package app artifact
        if: success()
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION/$APP_NAME.app"
          ditto -c -k --keepParent "$APP_PATH" "$APP_NAME.zip"

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macOS-${{ github.sha }}
          path: ${{ env.APP_NAME }}.zip
