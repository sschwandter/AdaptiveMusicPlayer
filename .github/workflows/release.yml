name: macOS Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: macos-26
    env:
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Release
      ARCHIVE_PATH: .build/ReleaseArchive/AdaptiveMusicPlayer.xcarchive
      EXPORT_PATH: .build/ReleaseExport
      RELEASE_TAG: ${{ inputs.tag_name }}
      RELEASE_ZIP: AdaptiveMusicPlayer-${{ inputs.tag_name }}-macOS.zip

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash tools/ci/import_signing_certificate.sh

      - name: Archive signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: bash tools/ci/archive_signed_app.sh

      - name: Export signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: bash tools/ci/export_signed_app.sh

      - name: Package signed app
        run: bash tools/ci/package_app.sh "$EXPORT_PATH/$APP_NAME.app" "$RELEASE_ZIP"

      - name: Notarize signed app
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash tools/ci/notarize_release.sh

      - name: Upload signed app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-macOS-${{ env.RELEASE_TAG }}
          path: ${{ env.RELEASE_ZIP }}

      - name: Upload signed app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.RELEASE_ZIP }}
