name: macOS Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-26
    env:
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Debug
      DERIVED_DATA_PATH: .build/DerivedData
      TEST_RESULT_BUNDLE: TestResults.xcresult

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild \
            -scheme "$APP_NAME" \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -scheme "$APP_NAME" \
            -destination 'platform=macOS' \
            -only-testing:AdaptiveMusicPlayerTests \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$TEST_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-xcresult-${{ github.sha }}
          path: ${{ env.TEST_RESULT_BUNDLE }}
          if-no-files-found: error

      - name: Summarize test results
        if: always()
        run: python3 tools/ci/summarize_xcresult.py "$TEST_RESULT_BUNDLE" >> "$GITHUB_STEP_SUMMARY"

  signed-release:
    needs: validate
    runs-on: macos-26
    env:
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Release
      ARCHIVE_PATH: .build/ReleaseArchive/AdaptiveMusicPlayer.xcarchive
      EXPORT_PATH: .build/ReleaseExport
      RELEASE_ZIP: AdaptiveMusicPlayer-${{ github.event.release.tag_name }}-macOS.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash tools/ci/import_signing_certificate.sh

      - name: Archive signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: bash tools/ci/archive_signed_app.sh

      - name: Export signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: bash tools/ci/export_signed_app.sh

      - name: Package signed app
        run: bash tools/ci/package_app.sh "$EXPORT_PATH/$APP_NAME.app" "$RELEASE_ZIP"

      - name: Notarize signed app
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash tools/ci/notarize_release.sh

      - name: Upload signed app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-macOS-${{ github.sha }}
          path: ${{ env.RELEASE_ZIP }}

      - name: Upload signed app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.RELEASE_ZIP }}
