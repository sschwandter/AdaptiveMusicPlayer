name: Release Please

on:
  workflow_run:
    workflows:
      - macOS CI
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect Release Please merge commit
        id: detect
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          subject="$(git log -1 --pretty=%s "$HEAD_SHA")"
          body="$(git log -1 --pretty=%B "$HEAD_SHA")"
          parents="$(git rev-list --parents -n 1 "$HEAD_SHA")"

          second_parent_subject=""
          set -- $parents
          if [ "$#" -ge 3 ]; then
            second_parent="$3"
            second_parent_subject="$(git log -1 --pretty=%s "$second_parent")"
          fi

          echo "Subject: $subject"
          echo "Second parent subject: $second_parent_subject"

          is_release_merge=false
          if grep -q 'release-please--branches--main' <<< "$subject"; then
            is_release_merge=true
          elif grep -q '^chore(main): release AdaptiveMusicPlayer ' <<< "$subject"; then
            is_release_merge=true
          elif grep -q '^chore(main): release AdaptiveMusicPlayer ' <<< "$second_parent_subject"; then
            is_release_merge=true
          elif grep -q '^chore(main): release AdaptiveMusicPlayer ' <<< "$body"; then
            is_release_merge=true
          fi

          echo "is_release_merge=$is_release_merge" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR only
        if: ${{ steps.detect.outputs.is_release_merge != 'true' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Create GitHub release only
        id: release
        if: ${{ steps.detect.outputs.is_release_merge == 'true' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Refuse releases for a different commit
        if: >-
          ${{
            steps.release.outputs.release_created == 'true' &&
            steps.release.outputs.sha != github.event.workflow_run.head_sha
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Release Please created $TAG_NAME for $RELEASE_SHA, but CI passed for $CI_SHA."
          echo "Deleting the mismatched GitHub release and tag."
          gh release delete "$TAG_NAME" --cleanup-tag --yes
          exit 1

  signed-release:
    needs: release-please
    if: >-
      ${{
        needs.release-please.outputs.release_created == 'true' &&
        needs.release-please.outputs.release_sha == github.event.workflow_run.head_sha
      }}
    uses: ./.github/workflows/signed-release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write
