name: Release Please

on:
  workflow_run:
    workflows:
      - macOS CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  signed-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-26
    permissions:
      contents: write
    env:
      APP_NAME: AdaptiveMusicPlayer
      BUILD_CONFIGURATION: Release
      ARCHIVE_PATH: .build/ReleaseArchive/AdaptiveMusicPlayer.xcarchive
      EXPORT_PATH: .build/ReleaseExport
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_ZIP: AdaptiveMusicPlayer-${{ needs.release-please.outputs.tag_name }}-macOS.zip

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash tools/ci/import_signing_certificate.sh

      - name: Archive signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: bash tools/ci/archive_signed_app.sh

      - name: Export signed app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CODE_SIGN_IDENTITY: Developer ID Application
        run: bash tools/ci/export_signed_app.sh

      - name: Package signed app
        run: bash tools/ci/package_app.sh "$EXPORT_PATH/$APP_NAME.app" "$RELEASE_ZIP"

      - name: Notarize signed app
        env:
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash tools/ci/notarize_release.sh

      - name: Upload signed app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-signed-macOS-${{ env.RELEASE_TAG }}
          path: ${{ env.RELEASE_ZIP }}

      - name: Upload signed app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.RELEASE_ZIP }}
